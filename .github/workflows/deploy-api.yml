name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/types/**
      - packages/database/**
      - packages/utils/**

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service mathquest-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
